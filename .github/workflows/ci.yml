name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5.0.1

      - name: Flutter 설치
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze --no-pub

      - name: 테스트 실행
        run: flutter test --no-pub

  build:
    name: Android APK 빌드 검증
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5.0.1

      - name: Flutter 설치
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Gradle 캐시
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 의존성 설치
        run: flutter pub get

      - name: Android APK 빌드 검증
        run: flutter build apk --debug
